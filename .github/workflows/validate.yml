name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Marketplace + plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the bump gate can diff against the PR merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest (root)
        run: claude plugin validate .

      - name: Drift check + version bump gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-marketplace-drift.mjs --base "origin/$BASE_REF"
          else
            node scripts/check-marketplace-drift.mjs
          fi

      # Documentation integrity. Both are pure filesystem reads — no network,
      # no sibling *-mcp checkouts — so they run on every PR in well under a
      # second. scripts/tool-drift-audit.mjs is deliberately NOT wired in here;
      # it needs the vendor server repos, which CI does not have.
      - name: Reference resolution
        run: node scripts/check-doc-references.mjs

      - name: Tool anchoring
        run: node scripts/check-tool-anchoring.mjs

      # Per-plugin validation checks skill/agent/command frontmatter, which
      # root validation does not. Hard-failing since #137 landed the repo-wide
      # frontmatter cleanup (63/63 plugins pass). TODO: add --strict once
      # warnings hit zero.
      - name: Validate each plugin
        run: |
          fail=0
          for dir in $(node -e "require('./.claude-plugin/marketplace.json').plugins.forEach(p=>console.log(p.source.replace('./','')))"); do
            echo "::group::${dir}"
            if ! claude plugin validate "$dir"; then
              echo "::warning title=Plugin validation failed::${dir}"
              fail=$((fail+1))
            fi
            echo "::endgroup::"
          done
          echo "${fail} plugin(s) failed per-plugin validation"
          [ "$fail" -eq 0 ]
