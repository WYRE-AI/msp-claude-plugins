name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'msp-claude-plugins/docs/**'
      - '.claude-plugin/marketplace.json'
      - 'msp-claude-plugins/**/.claude-plugin/plugin.json'
      - 'msp-claude-plugins/**/README.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: msp-claude-plugins/docs/package-lock.json

      - name: Install dependencies
        working-directory: msp-claude-plugins/docs
        run: npm ci

      - name: Build with Astro
        working-directory: msp-claude-plugins/docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: msp-claude-plugins/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify-gateway:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mcp-gateway rebuild
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GATEWAY_DISPATCH_TOKEN }}
          repository: wyre-technology/mcp-gateway
          event-type: docs-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
